repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        types_or: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check .
        language: system
        types_or: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types_or: [python]
        pass_filenames: false
