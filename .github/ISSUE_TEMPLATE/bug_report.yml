name: Bug report
description: Report a problem with the project.
title: "[Bug]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please provide as much detail as possible to help us understand and address the issue.
        This will help us prioritize and fix the problem effectively.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the steps needed to reproduce the problem.
      placeholder: |
        1. Step one
        2. Step two
        3. Step three
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
      description: Provide any relevant logs or other context.
    validations:
      required: false